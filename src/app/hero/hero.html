<div class="hero-scroll" #heroScroll>

  <section class="hero" id="home">


    <!-- HERO CONTENT -->
    <div class="hero-content">

      <div class="hero-badge">
        Trusted Global Trade Partner
      </div>

      <h1>
        Global Sourcing for
        <br>
        Food Ingredients &
        <br>
        Industrial Chemicals
      </h1>

      <p>
        Reliable supply partner for manufacturers across India and the world.
      </p>

      <div class="hero-buttons">

        <a href="#products" class="btn-primary">
          Explore Products
        </a>

        <a href="#contact" class="btn-secondary">
          Request a Quote
        </a>

      </div>

    </div>


    <!-- SHIP -->
    <div
      #ship
      class="ship"
      [style.transform]="'translate3d(' + shipPosition + 'px, 0, 0)'"
    >

      <svg
        viewBox="0 0 700 220"
        xmlns="http://www.w3.org/2000/svg"
      >

        <!-- CRANE -->
        <line
          x1="220"
          y1="105"
          x2="220"
          y2="55"
          stroke="#34495e"
          stroke-width="4"
        />

        <line
          x1="220"
          y1="58"
          x2="145"
          y2="90"
          stroke="#66798d"
          stroke-width="5"
        />


        <!-- RED STACK -->
        <rect
          x="285"
          y="75"
          width="55"
          height="65"
          fill="#b73455"
        />

        <rect
          x="285"
          y="70"
          width="55"
          height="12"
          fill="#18324f"
        />


        <!-- CABIN -->
        <rect
          x="365"
          y="55"
          width="155"
          height="85"
          fill="#e8edf2"
        />

        <!-- CABIN TOP -->
        <rect
          x="410"
          y="35"
          width="110"
          height="25"
          fill="#dbe3ea"
        />


        <!-- WINDOWS -->
        <rect x="385" y="75" width="18" height="22" fill="#52799e" />
        <rect x="408" y="75" width="18" height="22" fill="#52799e" />
        <rect x="431" y="75" width="18" height="22" fill="#52799e" />
        <rect x="454" y="75" width="18" height="22" fill="#52799e" />
        <rect x="477" y="75" width="18" height="22" fill="#52799e" />


        <!-- SHIP BODY -->
        <path
          d="
            M 30 135
            L 670 135
            L 620 195
            L 90 195
            Z
          "
          fill="#18324f"
        />


        <!-- RED BOTTOM -->
        <path
          d="
            M 90 195
            L 620 195
            L 605 207
            L 105 207
            Z
          "
          fill="#e52d55"
        />


        <!-- SHIP NAME -->
        <text
          x="300"
          y="170"
          fill="#9aaabb"
          font-size="14"
          letter-spacing="5"
        >
          S P INTERNATIONAL
        </text>

      </svg>

    </div>


    <!-- SCROLL INDICATOR -->
    <div class="scroll-indicator">

      <span>
        SCROLL
      </span>

      <div class="scroll-arrow">
        ⌄
      </div>

    </div>

  </section>

</div>
